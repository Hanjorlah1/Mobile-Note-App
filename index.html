<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scribble</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="main" id="main">
      <div class="container-fluid pt-4 px-3">
        <div class="main-view-nav">
          <h1>My Notes</h1>
          <button
            type="button"
            class="btn btn-outline-secondary"
            id="themeToggleBtn"
          >
            🌙
          </button>
        </div>

        <form id="searchForm" method="get" class="mt-3">
          <input
            type="search"
            placeholder="Search..."
            id="searchInput"
            class="search-input"
            name="search"
          />
        </form>
        <section id="savedNotes">
          <div class="container-fluid mx-0 px-0 mt-4">
            <div class="saved-notes-container" id="savedNotesContainer"></div>
            <button type="button" class="btn" id="newNoteBtn">New Note</button>
          </div>
        </section>
      </div>
    </main>

    <div class="container-fluid editor-view" id="editorView">
      <nav>
        <div class="editor-view-nav">
          <button
            type="button"
            class="btn editor-view-nav-btn"
            id="backNavigationBtn"
          >
            Back
          </button>
          <button type="button" class="btn delete-btn" id="deleteBtn">
            Delete
          </button>
          <button
            type="button"
            class="btn editor-view-nav-btn"
            id="saveNoteBtn"
          >
            Save
          </button>
        </div>
      </nav>
      <div class="container-fluid note-title-div" id="noteTitleDiv">
        <input
          type="text"
          placeholder="Title"
          class="new-note-title-input"
          name="Note-Title"
          id="noteTitle"
          maxlength="20"
        />
        <textarea class="note-content" id="noteContent" rows="1"> </textarea>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
